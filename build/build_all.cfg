# build_all.cfg — build target definitions for the GNU APL build_all script
#
# This file is sourced by build_all.  It defines:
#   1. configure-option shortcuts (single uppercase words)
#   2. the default build order (DEFAULT_CONFIGS)
#   3. per-target settings using three variables each:
#        build_cfg_NAME   — configure options passed to ../../configure
#        build_art_NAME   — expected artifact, relative to VSRC_dir
#        build_test_NAME  — "yes" to run 'make test' after a successful build
#
# Targets not listed here must have a build_NAME() function in build_all
# (currently: tar, git).

# ── email ────────────────────────────────────────────────────────────────────
# Address that receives the nightly build-result HTML email.
# Set to "" to suppress email.
RESULTS_EMAIL="eedjsa@localhost"   # delivered locally on server72, pulled to server68 by pull-nightly-build-report.sh

# ── configure option shortcuts ──────────────────────────────────────────────
STD="--enable-maintainer-mode"
LIBAPL="--with-libapl"
PYTHON="--with-python"
ERLANG="--with-erlang"
DEV="DEVELOP_WANTED=yes"
RAT="RATIONAL_NUMBERS_WANTED=yes"
PERF="PERFORMANCE_COUNTERS_WANTED=yes"
DYLO="DYNAMIC_LOG_WANTED=yes"
XCB="--without-gtk3"
CC_3="CORE_COUNT_WANTED=-3"        # ⎕SYL controls the number of cores
noVC="VALUE_CHECK_WANTED=no"
noVH="VALUE_HISTORY_WANTED=no"
AL0="ASSERT_LEVEL_WANTED=0"        # no ASSERTions
FAST="$noVC $noVH $AL0"

# ── default build order ──────────────────────────────────────────────────────
# Uncomment "git" to also build from the Savannah git mirror.
# "asan" (AddressSanitizer, see build_asan() in build_all) is listed
# unconditionally here -- it self-gates on hostname and is a harmless,
# near-instant no-op on any host other than server68. Do NOT try to gate
# it by editing this list per host: server72 (848M RAM, 1 core) ships
# the exact same build_all.cfg/build_all as server68 (15G RAM, 12
# cores) via the server72-push-apl rsync, so host-specific config lists
# would just get silently overwritten on the next push.
DEFAULT_CONFIGS="standard develop tar libxcb rational libapl parallel_bench erlang python asan"
# DEFAULT_CONFIGS="standard develop tar git libxcb rational libapl parallel_bench erlang python"

# ── per-target definitions ───────────────────────────────────────────────────

build_cfg_standard="$STD"
build_art_standard="apl"
build_test_standard="yes"

build_cfg_develop="$STD $DEV"
build_art_develop="apl"
build_test_develop="yes"

build_cfg_libxcb="$STD $XCB"
build_art_libxcb="apl"
build_test_libxcb="yes"

build_cfg_rational="$STD $DEV $RAT"
build_art_rational="apl"
build_test_rational="no"

build_cfg_libapl="$STD $LIBAPL"
build_art_libapl=".libs/libapl.so"
build_test_libapl="no"

build_cfg_python="$STD $PYTHON"
build_art_python=".libs/lib_gnu_apl.so"
build_test_python="no"

build_cfg_parallel_bench="$STD $FAST $PERF $DYLO $CC_3"
build_art_parallel_bench="apl"
build_test_parallel_bench="no"

build_cfg_erlang="$STD $ERLANG"
# --with-erlang implies --with-libapl (m4/apl_TARGETs.m4). The Erlang NIF
# itself (erlang/) is only built if erlc is installed, so check libapl.
build_art_erlang=".libs/libapl.so"
build_test_erlang="no"
